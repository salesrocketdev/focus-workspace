name: V4 prototype checks
on:
  pull_request:
    paths:
      - 'prototypes/ui/**'
      - '.github/workflows/prototype-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototypes/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-prototype-evidence
          path: prototypes/ui/test-results/
          if-no-files-found: warn
