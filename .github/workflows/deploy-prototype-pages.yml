name: Deploy V4 prototype to Pages

on:
  push:
    branches: [prototype/ui-v4]
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run full checks and published audit before accepting a milestone
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]') || contains(github.event.head_commit.message, '[release]')) && 'prototype-pages' || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == 'refs/heads/prototype/ui-v4' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]') || contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototypes/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-prototype-${{ runner.os }}-${{ hashFiles('prototypes/ui/package.json', 'prototypes/ui/package-lock.json') }}
          restore-keys: npm-prototype-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Typecheck and build for Pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/ui/dist
      - name: Storybook build (release)
        if: ${{ inputs.full_validation == true || contains(github.event.head_commit.message, '[release]') }}
        run: npm run build-storybook
      - name: Install test browsers (release)
        if: ${{ inputs.full_validation == true || contains(github.event.head_commit.message, '[release]') }}
        run: npx playwright install --with-deps chromium webkit
      - name: Functional regression (release)
        if: ${{ inputs.full_validation == true || contains(github.event.head_commit.message, '[release]') }}
        run: npm test
      - name: Offline regression (release)
        if: ${{ inputs.full_validation == true || contains(github.event.head_commit.message, '[release]') }}
        run: npm run test:offline
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.full_validation == true || contains(github.event.head_commit.message, '[release]')) }}
        with:
          name: v4-prototype-evidence
          path: prototypes/ui/test-results/
          if-no-files-found: warn
          retention-days: 7


  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live React prototype (not Jekyll)
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, urllib.request, urllib.parse, re
          url = os.environ["SITE_URL"].rstrip("/") + "/"
          for attempt in range(18):
              try:
                  request = urllib.request.Request(url + "?deploy=" + os.environ["GITHUB_SHA"], headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      html = response.read().decode()
                  assert 'id="root"' in html, "Live site does not contain the React mount element"
                  match = re.search(r'<script[^>]+src="([^"]+/assets/[^"]+\.js)"', html)
                  assert match, "Vite bundle not found"
                  asset_url = urllib.parse.urljoin(url, match.group(1))
                  with urllib.request.urlopen(asset_url, timeout=15) as response:
                      assert response.status == 200 and "javascript" in response.headers.get("Content-Type", "").lower(), "JavaScript asset is unavailable"
                  print("Verified live React HTML and JS:", url, asset_url)
                  break
              except Exception as error:
                  print(f"Attempt {attempt + 1}: {error}", flush=True)
                  if attempt == 17:
                      raise
                  time.sleep(10)
          PY

  audit:
    needs: deploy
    if: ${{ inputs.full_validation == true || contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototypes/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-prototype-${{ runner.os }}-${{ hashFiles('prototypes/ui/package.json', 'prototypes/ui/package-lock.json') }}
          restore-keys: npm-prototype-${{ runner.os }}-
      - run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=live-audit.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-live-audit
          path: |
            prototypes/ui/live-audit-results/
            prototypes/ui/live-audit-report/
          if-no-files-found: warn
          retention-days: 7
