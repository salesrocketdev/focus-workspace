name: Application CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/application-ci.yml'
  push:
    branches: [main, 'feat/m1-foundation']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/application-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: application-foundation
          path: |
            pnpm-lock.yaml
            apps/client/dist/
          if-no-files-found: error
